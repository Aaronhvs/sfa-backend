version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: ./django/production/Dockerfile
    ports:
      - "8000:8000"
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+asyncpg://sfa:sfa@db:5432/sfa
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
    depends_on:
      - db
      - redis
    command: /start

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sfa
      POSTGRES_PASSWORD: sfa
      POSTGRES_DB: sfa
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  celery_worker:
    build:
      context: .
      dockerfile: ./django/production/Dockerfile
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+asyncpg://sfa:sfa@db:5432/sfa
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
    depends_on:
      - db
      - redis
    command: celery -A sfa.celery_app worker --loglevel=info

volumes:
  postgres_data:
